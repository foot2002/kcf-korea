  <rect x="206" y="210" width="68" height="16" rx="4" fill="#94A3B8"/>
  <!-- dashed leaks -->
  <path d="M190 150 C 140 130, 120 100, 100 86" fill="none" stroke="#E07A2F" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/>
  <path d="M290 150 C 340 130, 360 100, 384 84" fill="none" stroke="#E07A2F" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/>
