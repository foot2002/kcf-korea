  <path d="M280 240 C 310 270, 340 280, 372 284" fill="none" stroke="#E07A2F" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/>
  <!-- personal account avatar -->
  <circle cx="86" cy="70" r="30" fill="#FFFFFF" stroke="#0B3A6E" stroke-width="3"/>
  <circle cx="86" cy="62" r="10" fill="#0B3A6E"/>
  <path d="M68 88 c4 -12 12 -16 18 -16 s14 4 18 16" fill="#0B3A6E"/>
  <!-- laptop PC -->
  <rect x="352" y="52" width="76" height="50" rx="6" fill="#0B3A6E"/>
  <rect x="358" y="58" width="64" height="38" rx="3" fill="#E8EEF6"/>
  <rect x="366" y="66" width="22" height="28" rx="2" fill="#FFFFFF" stroke="#94A3B8"/>
  <rect x="392" y="66" width="22" height="28" rx="2" fill="#FFFFFF" stroke="#94A3B8"/>
  <path d="M344 102 h92 l-8 8 h-76 z" fill="#94A3B8"/>
