  <rect x="206" y="128" width="50" height="8" rx="4" fill="#0B3A6E"/>
  <rect x="206" y="146" width="68" height="12" rx="3" fill="#F1F5F9" stroke="#CBD5E1"/>
  <rect x="206" y="166" width="68" height="12" rx="3" fill="#F1F5F9" stroke="#CBD5E1"/>
