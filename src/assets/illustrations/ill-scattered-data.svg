  <rect x="372" y="250" width="54" height="64" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <rect x="380" y="262" width="38" height="5" rx="2.5" fill="#0F766E"/>
  <rect x="380" y="274" width="38" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="380" y="284" width="38" height="4" rx="2" fill="#CBD5E1"/>
