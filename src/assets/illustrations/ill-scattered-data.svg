  <g transform="rotate(8 390 290)">
    <rect x="360" y="262" width="54" height="64" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <rect x="368" y="274" width="38" height="5" rx="2.5" fill="#0F766E"/>
    <rect x="368" y="286" width="38" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="368" y="296" width="38" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="368" y="306" width="26" height="4" rx="2" fill="#CBD5E1"/>
