  <path d="M240 46 l24 42 h-48 z" fill="#E07A2F" stroke="#E07A2F" stroke-width="6" stroke-linejoin="round"/>
  <rect x="238" y="58" width="4" height="16" rx="2" fill="#FFFFFF"/>
  <circle cx="240" cy="80" r="2.6" fill="#FFFFFF"/>
